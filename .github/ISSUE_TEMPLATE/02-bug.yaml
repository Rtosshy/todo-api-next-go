name: "🐛 バグ報告"
description: "バグを報告する"
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 概要
      description: どんなバグが発生しているか
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: バグを再現するための手順を記述してください
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      description: 本来どう動くべきか
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際にはどう動いたか
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 環境
      description: 発生環境を記述してください
      value: |
        - OS:
        - ブラウザ / バージョン:
        - Node.js:
        - Go:
    validations:
      required: false
